services:
  - type: web
    name: chunmyung-saju-demo
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/plaza/state
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com
      - key: SPRINGDOC_ENABLED
        value: "false"
