# 무료 데모 배포 전용 프로필 (외부 MySQL 없이 내장 H2 MySQL 호환 모드로 즉시 기동)
# 실행: SPRING_PROFILES_ACTIVE=demo

server:
  port: ${PORT:8085}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

chunmyung:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.onrender.com,http://localhost:8085}

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:chunmyung_saju;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
